[package]
name = "orbit-app"
description = "Orbit desktop client: the GPUI Kit user interface."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "orbit-desktop"
path = "src/main.rs"

[features]
default = ["fast"]
# Render on GPUI Fast (retained mode, scroll layers). Build with
# `--no-default-features` to compare against the pinned upstream GPUI.
fast = ["gpui-kit/gpui-fast", "orbit-terminal/fast", "orbit-browser/fast"]

[dependencies]
# `x11` is a gpui-kit default; it is listed so the Linux backends stay on if
# default features are ever turned off (Wayland is always built on Linux).
# Grammars for syntax highlighting in diffs and code blocks: the languages
# agents most often edit. Each adds a compiled parser to the binary.
gpui-kit = { version = "0.11", features = [
    "tree-sitter", "x11",
    "tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript",
    "tree-sitter-python", "tree-sitter-go", "tree-sitter-toml", "tree-sitter-yaml",
    "tree-sitter-markdown", "tree-sitter-css", "tree-sitter-html", "tree-sitter-bash",
] }
orbit-proto = { workspace = true }
orbit-core = { workspace = true }
orbit-net = { workspace = true }
orbit-terminal = { path = "../orbit-terminal", default-features = false }
orbit-browser = { path = "../orbit-browser", default-features = false }
mimalloc = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { workspace = true }
sonic-rs = { workspace = true }
futures = "0.3"

[dev-dependencies]
tempfile = "3"
gpui-kit = { version = "0.11", features = ["tree-sitter", "x11", "test-support"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
