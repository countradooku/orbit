[package]
name = "orbit-app"
description = "Orbit desktop client: the GPUI Kit user interface."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "orbit"
path = "src/main.rs"

[features]
default = ["fast"]
# Render on GPUI Fast (retained mode, scroll layers). Build with
# `--no-default-features` to compare against the pinned upstream GPUI.
fast = ["gpui-kit/gpui-fast", "orbit-terminal/fast"]

[dependencies]
# `x11` is a gpui-kit default; it is listed so the Linux backends stay on if
# default features are ever turned off (Wayland is always built on Linux).
gpui-kit = { version = "0.11", features = ["tree-sitter", "x11"] }
orbit-proto = { workspace = true }
orbit-core = { workspace = true }
orbit-net = { workspace = true }
orbit-terminal = { path = "../orbit-terminal", default-features = false }
mimalloc = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sonic-rs = { workspace = true }

[dev-dependencies]
tempfile = "3"
