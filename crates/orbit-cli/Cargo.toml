[package]
name = "orbit-cli"
description = "The orbit command line and MCP server: drive a running Orbit engine from scripts and agents."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
orbit-proto = { workspace = true }
# Checking and packing plugin folders here (`orbit plugin validate|pack`);
# without the host feature, so no WebAssembly runtime or keychain.
orbit-plugin = { workspace = true }
# Client side only: the CLI connects to a running engine, it never embeds one.
orbit-net = { workspace = true, default-features = false }
crossfire = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "wrap_help", "string"] }
clap_complete = "4.6"
serde_json = "1"
dirs = { workspace = true }

[dev-dependencies]
orbit-core = { workspace = true }
orbit-net = { workspace = true, features = ["engine"] }
tempfile = "3"
