[package]
name = "orbit-net"
description = "Orbit protocol over WebSockets (sockudo-ws): the orbitd server, the remote client, and a backend-agnostic feed for UIs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["engine"]
# The server side and the in-process backend. Clients that only connect to a
# running engine (the `orbit` CLI) turn it off and skip the engine entirely.
engine = ["dep:orbit-core", "dep:getrandom"]

[dependencies]
orbit-proto = { workspace = true }
orbit-core = { workspace = true, optional = true }
crossfire = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
sockudo-ws = { workspace = true }
log = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = "1"
getrandom = { version = "0.3", optional = true }
bytes = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
