[package]
name = "orbit-core"
description = "Orbit engine: storage, agent providers, git, checkpoints and terminals."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
orbit-proto = { workspace = true }
# Plugins: manifests, the host's install and consent logic, the WebAssembly
# sandbox (wasmi) and the keychain.
orbit-plugin = { workspace = true, features = ["host"] }
bitcode = { workspace = true }
wincode = { workspace = true }
crossfire = { workspace = true }
tokio = { workspace = true }
sonic-rs = { workspace = true }
serde = { workspace = true }
blake3 = "1.8"
notify = "9"
portable-pty = { workspace = true }
log = { workspace = true }
dirs = { workspace = true }
memchr = { workspace = true }
similar = { workspace = true }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
parking_lot = { workspace = true }
ignore = "0.4"
# HTTPS for the Linear and Jira APIs: the hyper and rustls (ring) stack GPUI
# Kit already links for its own HTTP client, so the app gains no new crates;
# async on the engine's runtime, no thread per request.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
http-body-util = "0.1"
bytes = "1"
# Time zones for automation schedules (IANA database bundled on Windows);
# already linked through env_logger.
jiff = "1"
# `orbit.toml` and Codex environments (already in the lock for GPUI Kit).
toml = "1"

# SHA-256 names the macOS keychain item of a second Claude account
# (`usage::claude`); already linked through rustls.
[target.'cfg(target_os = "macos")'.dependencies]
ring = "0.17"

[dev-dependencies]
tempfile = "3"
orbit-plugin = { workspace = true, features = ["host", "testing"] }

# A scripted stand-in for `codex app-server`, used only by the Codex adapter
# tests (`CARGO_BIN_EXE_orbit-fake-codex`).
[[bin]]
name = "orbit-fake-codex"
path = "tests/support/fake_codex.rs"
test = false
doc = false
bench = false

# A scripted stand-in for ACP agents, `pi --mode rpc` and `opencode serve`,
# used only by those adapters' tests (`CARGO_BIN_EXE_orbit-fake-agent`).
[[bin]]
name = "orbit-fake-agent"
path = "tests/support/fake_agent.rs"
test = false
doc = false
bench = false

# A stand-in for `gh` and `glab` that answers from fixtures, used only by the
# forge tests (`CARGO_BIN_EXE_orbit-fake-forge`).
[[bin]]
name = "orbit-fake-forge"
path = "tests/support/fake_forge.rs"
test = false
doc = false
bench = false
