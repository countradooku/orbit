[package]
name = "orbit-core"
description = "Orbit engine: storage, agent providers, git, checkpoints and terminals."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
orbit-proto = { workspace = true }
bitcode = { workspace = true }
crossfire = { workspace = true }
tokio = { workspace = true }
sonic-rs = { workspace = true }
serde = { workspace = true }
blake3 = "1.8"
notify = "9"
portable-pty = { workspace = true }
log = { workspace = true }
dirs = { workspace = true }
memchr = { workspace = true }
similar = { workspace = true }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
parking_lot = { workspace = true }
ignore = "0.4"

[dev-dependencies]
tempfile = "3"

# A scripted stand-in for `codex app-server`, used only by the Codex adapter
# tests (`CARGO_BIN_EXE_orbit-fake-codex`).
[[bin]]
name = "orbit-fake-codex"
path = "tests/support/fake_codex.rs"
test = false
doc = false
bench = false

# A scripted stand-in for ACP agents, `pi --mode rpc` and `opencode serve`,
# used only by those adapters' tests (`CARGO_BIN_EXE_orbit-fake-agent`).
[[bin]]
name = "orbit-fake-agent"
path = "tests/support/fake_agent.rs"
test = false
doc = false
bench = false
