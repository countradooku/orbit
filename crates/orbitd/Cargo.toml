[package]
name = "orbitd"
description = "Orbit's host: the engine headless, as a server for remote clients or as the desktop's background host."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
orbit-core = { workspace = true }
orbit-net = { workspace = true }
orbit-bots = { workspace = true }
tokio = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
mimalloc = { workspace = true }
orbit-proto = { workspace = true }
crossfire = { workspace = true }

[dev-dependencies]
tempfile = "3"


# Its own `main`: the test binary is also the fake `ssh` and `scp` it runs.
[[test]]
name = "remote"
harness = false
