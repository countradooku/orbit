[package]
name = "orbit-terminal"
description = "Orbit terminal view: a GPUI Kit terminal emulator element on alacritty_terminal."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["fast"]
# Render on GPUI Fast, like orbit-app. Features unify: an app that compares
# backends depends on this crate with `default-features = false` and forwards
# its own `fast` feature here.
fast = ["gpui-kit/gpui-fast"]

[dependencies]
gpui-kit = { version = "0.11", features = ["tree-sitter"] }
alacritty_terminal = { version = "0.26", default-features = false }
log = { workspace = true }

[dev-dependencies]
orbit-core = { workspace = true }
crossfire = { workspace = true }
gpui-kit = { version = "0.11", features = ["tree-sitter", "test-support"] }
